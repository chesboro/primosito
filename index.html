<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Questionario Simpatico — Con Stella Magica</title>
  <style>
    /* --- Variabili di tema moderno --- */
    :root {
      --bg: #f8f5ff;
      --card: #ffffff;
      --accent: #7b5cff;
      --accent-dark: #5a2edc;
      --text-primary: #3b1d4e;
      --text-secondary: #6c4a86;
      --shadow: rgba(90, 40, 120, 0.12);
    }

    /* --- Reset e base --- */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, Arial;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      color: var(--text-primary);
    }
    a { text-decoration: none; color: inherit; }

    /* --- Header --- */
    header {
      width: 100%;
      padding: 24px;
      text-align: center;
      background: linear-gradient(90deg,#f5e6ff,#ffeef8);
      color: var(--accent-dark);
      font-weight: 700;
      font-size: 1.5rem;
      box-shadow: 0 4px 12px var(--shadow);
      border-bottom-left-radius: 0 16px;
      border-bottom-right-radius: 0 16px;
    }

    /* --- Wrapper e container --- */
    .wrap {
      max-width: 960px;
      width: 100%;
      padding: 24px;
    }

    .container {
      background: var(--card);
      border-radius: 20px;
      padding: 32px;
      box-shadow: 0 12px 40px var(--shadow);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      transition: transform 0.2s ease;
    }

    .container:hover { transform: translateY(-4px); }

    h2 {
      margin-bottom: 8px;
      font-size: 1.8rem;
      text-align: center;
      color: var(--text-primary);
    }

    .hint {
      font-size: 1rem;
      color: var(--text-secondary);
      text-align: center;
      max-width: 80%;
      margin-bottom: 24px;
    }

    /* --- Stella --- */
    .star-area {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .star {
      width: 140px;
      height: 140px;
      display: grid;
      place-items: center;
      border-radius: 24px;
      background: linear-gradient(180deg,#fff,#f9f4ff);
      cursor: pointer;
      box-shadow: 0 10px 24px var(--shadow);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .star:hover {
      transform: translateY(-6px) scale(1.1);
      box-shadow: 0 14px 36px var(--shadow);
    }
    .star svg {
      width: 72px;
      height: 72px;
      filter: drop-shadow(0 6px 12px rgba(150,80,200,.15));
    }

    /* --- Confetti --- */
    .confetti-piece {
      position: fixed;
      top: 0;
      left: 0;
      width: 10px;
      height: 16px;
      pointer-events: none;
      opacity: 0.95;
      border-radius: 2px;
      transform-origin: center;
      will-change: transform, top, opacity;
    }

    @keyframes fallRotate {
      0% { transform: translateY(-10vh) rotate(0deg); }
      100% { transform: translateY(120vh) rotate(520deg); }
    }

    /* --- GIF overlay --- */
    .gif-overlay {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.2);
      backdrop-filter: blur(4px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.18s ease;
    }
    .gif-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }
    .gif-card {
      background: var(--card);
      padding: 16px;
      border-radius: 16px;
      box-shadow: 0 16px 48px var(--shadow);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      max-width: 90%;
      text-align: center;
      animation: popIn 0.3s ease-out;
    }
    .gif-card img {
      max-width: 360px;
      border-radius: 12px;
      display: block;
    }
    .close-btn {
      padding: 10px 16px;
      border-radius: 12px;
      border: none;
      background: var(--accent);
      color: #fff;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s ease;
    }
    .close-btn:hover { background: var(--accent-dark); }

    @keyframes popIn {
      0% { transform: scale(0.85); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    /* --- Responsive --- */
    @media (max-width: 600px) {
      .star { width: 100px; height: 100px; }
      .star svg { width: 48px; height: 48px; }
      .gif-card img { max-width: 280px; }
      h2 { font-size: 1.5rem; }
      .hint { font-size: 0.95rem; }
      .container { padding: 24px; }
    }

  </style>
</head>
<body>
  <header>CIAO AMICA!✨</header>
  <div class="wrap">
    <div class="container">
      <h2>TOCCA LA STELLA!</h2>
      <p class="hint"></p>

      <div class="star-area">
        <button id="starBtn" class="star" aria-label="Stella magica">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path d="M12 2l2.59 5.26L20 9.27l-4 3.9.95 5.54L12 15.77 7.05 18.7 8 13.16 4 9.27l5.41-.99L12 2z" fill="#FFD54A" stroke="#FFB300" stroke-width="0.6"/>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <div id="confetti-root"></div>

  <div id="gifOverlay" class="gif-overlay" role="dialog" aria-hidden="true">
    <div class="gif-card">
      <img id="magicGif" src="https://media.tenor.com/WlJsOVX2lysAAAAi/cat-tongue-cat.gif" alt="GIF festosa" />
      <button id="closeGif" class="close-btn">Chiudi</button>
    </div>
  </div>

  <script>
    const starBtn = document.getElementById('starBtn');
    const confettiRoot = document.getElementById('confetti-root');
    const gifOverlay = document.getElementById('gifOverlay');
    const closeGif = document.getElementById('closeGif');

    function createPiece(x, hue){
      const el = document.createElement('div');
      el.className = 'confetti-piece';
      el.style.left = x + 'px';
      el.style.background = `hsl(${hue} 90% 55%)`;
      el.style.width = Math.round(Math.random()*12 + 6) + 'px';
      el.style.height = Math.round(Math.random()*14 + 8) + 'px';
      el.style.transform = `translateY(-10vh) rotate(${Math.random()*360}deg)`;
      const duration = Math.random() * 1.4 + 1.1;
      el.style.animation = `fallRotate ${duration}s linear forwards`;
      el.style.left = `calc(${x}px + ${Math.round(Math.random()*160 - 80)}px)`;
      confettiRoot.appendChild(el);
      setTimeout(() => el.remove(), duration*1000 + 200);
    }

    function shootConfetti(count = 80){
      const vw = Math.max(document.documentElement.clientWidth || 0, window.innerWidth || 0);
      const startX = vw/2;
      for(let i=0;i<count;i++){
        setTimeout(() => createPiece(startX + (Math.random()*160 - 80), Math.round(Math.random()*360)), i*6);
      }
    }

    function showGif(duration = 3000){
      gifOverlay.classList.add('active');
      gifOverlay.setAttribute('aria-hidden','false');
      const t = setTimeout(hideGif, duration);
      closeGif.onclick = () => { clearTimeout(t); hideGif(); };
    }

    function hideGif(){
      gifOverlay.classList.remove('active');
      gifOverlay.setAttribute('aria-hidden','true');
    }

    starBtn.addEventListener('click', () => {
      starBtn.animate([
        {transform:'scale(1)'},
        {transform:'scale(1.15)'},
        {transform:'scale(1)'}
      ],{duration:300,easing:'ease-out'});
      shootConfetti(80);
      showGif(3000);
    });

    gifOverlay.addEventListener('click', e => {
      if(e.target === gifOverlay) hideGif();
    });
	
  </script>
</body>
</html>
