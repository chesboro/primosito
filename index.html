<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Questionario Simpatico — Con Stella Magica</title>
  <style>
    :root{--bg:#fef7ff;--card:#fff;--accent:#b875ff;--accent-dark:#9d4dff}
    *{box-sizing:border-box}
    body{font-family:Inter, system-ui, -apple-system, 'Segoe UI', Roboto, Arial; background:var(--bg); margin:0; display:flex;flex-direction:column;align-items:center;min-height:100vh}
    header{width:100%;padding:20px;text-align:center;background:linear-gradient(90deg,#f5e6ff, #ffeef8);color:#4a1f63;font-weight:700;box-shadow:0 2px 6px rgba(0,0,0,.08)}
    .wrap{max-width:900px;width:100%;padding:24px}

    .container{max-width:640px;margin:20px auto;background:var(--card);border-radius:16px;padding:18px;box-shadow:0 8px 30px rgba(50,20,70,0.07)}

    .star-area{display:flex;align-items:center;justify-content:center;gap:18px;padding:30px 10px}
    .star{width:120px;height:120px;display:grid;place-items:center;border-radius:24px;background:linear-gradient(180deg,#fff,#f9f4ff);cursor:pointer;box-shadow:0 6px 18px rgba(110,50,150,0.12);transition:transform .14s ease}
    .star:hover{transform:translateY(-6px) scale(1.02)}

    /* stella SVG styling */
    .star svg{width:64px;height:64px;filter:drop-shadow(0 6px 12px rgba(150,80,200,.12))}
    .hint{font-size:0.95rem;color:#5b3a6a;text-align:center}

    /* confetti pieces */
    .confetti-piece{position:fixed;top:0;left:0;width:10px;height:16px;pointer-events:none;opacity:0.95;border-radius:2px;transform-origin:center;will-change:transform,top,opacity}

    /* GIF overlay */
    .gif-overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,0.18);backdrop-filter:blur(2px);opacity:0;pointer-events:none;transition:opacity .18s ease}
    .gif-overlay.active{opacity:1;pointer-events:auto}
    .gif-card{background:linear-gradient(180deg,#ffffff,#fff8ff);padding:12px;border-radius:14px;box-shadow:0 12px 40px rgba(90,40,120,.18);display:flex;flex-direction:column;align-items:center;gap:8px}
    .gif-card img{max-width:320px;border-radius:10px;display:block}
    .close-btn{margin-top:6px;padding:8px 12px;border-radius:10px;border:none;background:var(--accent);color:white;cursor:pointer}

    @keyframes fallRotate{0%{transform:translateY(-10vh) rotate(0deg)}100%{transform:translateY(120vh) rotate(520deg)}}

    /* small responsive tweaks */
    @media (max-width:480px){.star{width:96px;height:96px}.star svg{width:48px;height:48px}.gif-card img{max-width:260px}}
  </style>
</head>
<body>
  <header>Questionario Simpatico — Tocco la Stella ✨</header>
  <div class="wrap">
    <div class="container">
      <h2 style="margin-top:0;color:#3b1d4e">Pagina Magica</h2>
      <p class="hint">Clicca la stella per far partire coriandoli e mostrare una GIF simpatica — perfetto per perdere tempo in classe! 😉</p>

      <div class="star-area">
        <button id="starBtn" class="star" aria-label="Stella magica">
          <!-- SVG stella -->
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path d="M12 2l2.59 5.26L20 9.27l-4 3.9.95 5.54L12 15.77 7.05 18.7 8 13.16 4 9.27l5.41-.99L12 2z" fill="#FFD54A" stroke="#FFB300" stroke-width="0.6"/>
          </svg>
        </button>
      </div>

    </div>
  </div>

  <!-- contesto per i coriandoli -->
  <div id="confetti-root"></div>

  <!-- overlay con GIF che appare quando clicchi -->
  <div id="gifOverlay" class="gif-overlay" role="dialog" aria-hidden="true">
    <div class="gif-card">
      <!-- esempio GIF; puoi sostituirla con una tua -->
      <img id="magicGif" src="https://media.tenor.com/WlJsOVX2lysAAAAi/cat-tongue-cat.gif" alt="GIF festosa" />
      <button id="closeGif" class="close-btn">Chiudi</button>
    </div>
  </div>

  <script>
    const starBtn = document.getElementById('starBtn');
    const confettiRoot = document.getElementById('confetti-root');
    const gifOverlay = document.getElementById('gifOverlay');
    const closeGif = document.getElementById('closeGif');

    // genera un singolo pezzo di coriandolo
    function createPiece(x, hue){
      const el = document.createElement('div');
      el.className = 'confetti-piece';
      el.style.left = x + 'px';
      el.style.background = `hsl(${hue} 90% 55%)`;
      el.style.width = Math.round(Math.random()*12 + 6) + 'px';
      el.style.height = Math.round(Math.random()*14 + 8) + 'px';
      el.style.transform = `translateY(-10vh) rotate(${Math.random()*360}deg)`;
      el.style.zIndex = 9999;

      // durata e delay
      const duration = Math.random() * 1.4 + 1.1; // 1.1s - 2.5s
      el.style.animation = `fallRotate ${duration}s linear forwards`;

      // random horizontal drift using transition
      el.style.left = `calc(${x}px + ${Math.round(Math.random()*160 - 80)}px)`;

      confettiRoot.appendChild(el);

      // rimuovi dopo animazione
      setTimeout(() => { el.remove(); }, duration * 1000 + 200);
    }

    // spara coriandoli da centro pagina
    function shootConfetti(count = 60){
      const vw = Math.max(document.documentElement.clientWidth || 0, window.innerWidth || 0);
      const startX = vw/2;
      for(let i=0;i<count;i++){
        // leggero ritardo per effetto esplosione
        setTimeout(() => {
          createPiece(startX + (Math.random()*160 - 80), Math.round(Math.random()*360));
        }, i * 6); // spacing
      }
    }

    // mostra GIF overlay per un tempo limitato
    function showGif(duration = 2800){
      gifOverlay.classList.add('active');
      gifOverlay.setAttribute('aria-hidden','false');
      // chiude automaticamente dopo duration ms
      const t = setTimeout(() => {
        hideGif();
      }, duration);

      // se l'utente chiude manualmente, annulla il timeout
      closeGif.onclick = () => { clearTimeout(t); hideGif(); };
    }

    function hideGif(){
      gifOverlay.classList.remove('active');
      gifOverlay.setAttribute('aria-hidden','true');
    }

    // azione combinata quando si clicca la stella
    starBtn.addEventListener('click', () => {
      // piccolo effetto di scala
      starBtn.animate([
        {transform:'scale(1)'},
        {transform:'scale(1.12)'},
        {transform:'scale(1)'}
      ],{duration:300,easing:'ease-out'});

      // coriandoli + GIF
      shootConfetti(80);
      showGif(3000);
    });

    // chiusura cliccando fuori dalla GIF
    gifOverlay.addEventListener('click', (e)=>{
      if(e.target === gifOverlay) hideGif();
    });
  </script>
</body>
</html>
